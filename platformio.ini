[platformio]

[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_LOOP_STACK_SIZE=8192
    -fexceptions
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
lib_deps =
    https://github.com/m5stack/M5Gfx#0.2.19
    https://github.com/m5stack/M5Unified#0.2.13
    https://github.com/m5stack/M5Cardputer#1.1.1
    https://github.com/m5stack/TinyGPSPlus
    https://github.com/Hopperpop/Sgp4-Library
    bblanchon/ArduinoJson
    m5stack/M5Chain
    jgromes/RadioLib @ ^6.6.0